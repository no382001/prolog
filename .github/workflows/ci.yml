name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format bats

      - name: build
        run: make

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trilog-build
          path: |
            trilog
            _build

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: trilog-build

      - name: install bats
        run: sudo apt-get install -y bats

      - name: run quad tests
        run: |
          chmod +x ./trilog
          make quad-junit

      - name: run system tests
        run: make syscheck-junit

      - name: upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: _build/test-results/*.xml

      - name: build test summary
        if: always()
        run: |
          {
            echo "### Test results"
            echo ""
            echo "| Suite | Tests | Passed | Failed |"
            echo "|---|---|---|---|"
            total=0; passed=0; failed=0
            for f in _build/test-results/*_quad.xml; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .xml)
              t=$(grep -oE 'tests="[0-9]+"' "$f" | grep -oE '[0-9]+')
              fl=$(grep -oE 'failures="[0-9]+"' "$f" | grep -oE '[0-9]+')
              p=$((t - fl))
              echo "| $name | $t | $p | $fl |"
              total=$((total + t)); passed=$((passed + p)); failed=$((failed + fl))
            done
            if [ -f _build/test-results/report.xml ]; then
              st=$(grep -ohE 'tests="[0-9]+"' _build/test-results/report.xml | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
              sf=$(grep -ohE 'failures="[0-9]+"' _build/test-results/report.xml | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
              sp=$((st - sf))
              echo "| system (bats) | $st | $sp | $sf |"
              total=$((total + st)); passed=$((passed + sp)); failed=$((failed + sf))
            fi
            echo "| **TOTAL** | **$total** | **$passed** | **$failed** |"
          } > /tmp/test_summary.md
          cat /tmp/test_summary.md

      - name: comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/test_summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Test results';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
