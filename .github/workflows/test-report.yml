name: Test Report
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ main, dev ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: publish quad test results
        uses: dorny/test-reporter@v1
        with:
          artifact: test-results
          name: Quad Tests
          path: '*_quad.xml'
          reporter: java-junit
          fail-on-error: false

      - name: publish system test results
        uses: dorny/test-reporter@v1
        with:
          artifact: test-results
          name: System Tests
          path: 'report.xml'
          reporter: java-junit
          fail-on-error: false
